services:
  - type: web
    name: msa-portal-postgres-test
    runtime: python
    plan: free
    region: frankfurt
    branch: postgres-migration
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MSA_REQUIRE_POSTGRES
        value: "1"
      - key: MSA_RESULTS_DIR
        value: /tmp/msa-results
