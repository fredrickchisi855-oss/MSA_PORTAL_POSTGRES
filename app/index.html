<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSA PORTAL</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="Ka1Mlnh2XSr5-irkmkCmMmEWkVB5fAnxn50nGNqrePo" />
</head>

<body>

    <main class="portal">

        <section class="welcome">

            <div class="logo"><img src="../assets/mwashita_logo.jpg" alt="Mwashita School Logo"></div>

            <h1>MSA PORTAL</h1>

            <p class="subtitle">SCHOOL RESULTS SYSTEM</p>

            <div class="divider"></div>

            <p class="welcome-text">
                Welcome to the MSA Portal.
                View examination results quickly and securely.
            </p>

        </section>

        <section class="user-section">

            <h2>VIEW RESULTS</h2>

            <button class="primary-button" onclick="viewResults()">
                VIEW RESULTS
            </button>

        </section>

        <section class="admin-section">

            <h2>ADMINISTRATION</h2>

            <button class="secondary-button" onclick="adminLogin()">
                ADMIN LOGIN
            </button>

        </section>

        <footer>
            <p>MSA PORTAL</p>
            <span>Secure • Simple • Fast</span>
        </footer>

    </main>

    <script src="app.js?v=20261007disabled16"></script>

</body>
</html>
